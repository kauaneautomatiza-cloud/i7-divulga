<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel de Postagem — Notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #08060F;
    --bg-card: #120E1F;
    --border: #241E38;
    --violet: #8B5CF6;
    --pink: #EC4899;
    --text: #F1EEFA;
    --text-dim: #948FAA;
    --success: #34D399;
    --error: #F87171;
    --pending: #FBBF24;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 32px 20px 80px;
  }
  h1 {
    font-family: 'Sora', sans-serif;
    font-size: 22px;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--violet), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
  .container { max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    margin: 0 0 14px;
    font-weight: 600;
  }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  input[type="text"], input[type="url"], textarea {
    width: 100%;
    background: #0D0A18;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-bottom: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    background: linear-gradient(90deg, var(--violet), var(--pink));
    border: none;
    color: white;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .preview { display: flex; gap: 14px; margin-bottom: 14px; }
  .preview img { width: 135px; height: 90px; object-fit: cover; border-radius: 8px; background: #0D0A18; }
  .char-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin: -8px 0 14px; }
  .pages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .page-chip {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .page-chip.selected { border-color: var(--violet); background: rgba(139,92,246,0.1); }
  .page-chip input { margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .status { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 6px; }
  .status.sucesso { background: rgba(52,211,153,0.15); color: var(--success); }
  .status.erro { background: rgba(248,113,113,0.15); color: var(--error); }
  .status.pendente { background: rgba(251,191,36,0.15); color: var(--pending); }
  .row-actions { display: flex; gap: 8px; align-items: center; }
  .msg { font-size: 12px; margin-top: 8px; }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }
  .link-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toggle-manage { color: var(--text-dim); font-size: 12px; cursor: pointer; text-decoration: underline; }
  .progresso-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <h1>Painel de Postagem</h1>
      <div class="subtitle">Cole o link, escolha as páginas, poste. O comentário com o link é automático.</div>
    </div>
    <span class="toggle-manage" id="btn-sair" style="margin-top:4px;">sair</span>
  </div>

  <!-- POSTAR NOVA MATÉRIA -->
  <div class="card">
    <h2>Nova matéria</h2>
    <label for="link-input">Link da notícia</label>
    <input type="url" id="link-input" placeholder="https://..." />
    <button id="btn-preview" class="secondary">Buscar preview</button>

    <div id="preview-area" style="margin-top:16px; display:none;">
      <div class="preview">
        <img id="preview-img" src="" alt="preview" />
        <div style="flex:1;">
          <label for="titulo-input">Título (editável)</label>
          <textarea id="titulo-input"></textarea>
          <div class="char-count" id="char-count"></div>
        </div>
      </div>

      <label>Páginas
        <span class="toggle-manage" id="btn-selecionar-todas">selecionar todas</span> ·
        <span class="toggle-manage" id="toggle-paginas">ocultar</span>
      </label>
      <div id="paginas-grid-area">
        <div class="pages-grid" id="pages-grid"></div>
      </div>

      <button id="btn-postar">Postar nas páginas selecionadas</button>
      <div id="post-msg" class="msg"></div>
      <div id="progresso-lista" style="margin-top:12px; display:flex; flex-direction:column; gap:6px;"></div>
    </div>
  </div>

  <!-- HISTÓRICO -->
  <div class="card">
    <h2>Histórico <span class="toggle-manage" id="toggle-historico">mostrar</span></h2>
    <div id="historico-area" style="display:none;">
      <table>
        <thead>
          <tr><th>Data</th><th>Link</th><th>Título</th><th>Páginas</th><th>Status</th></tr>
        </thead>
        <tbody id="historico-body"></tbody>
      </table>
    </div>
  </div>

  <!-- GERENCIAR PÁGINAS -->
  <div class="card">
    <h2>Páginas cadastradas <span class="toggle-manage" id="toggle-manage">gerenciar</span></h2>
    <div id="manage-area" style="display:none;">
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <input type="text" id="nova-pagina-nome" placeholder="Nome da página" style="margin-bottom:0;" />
        <input type="text" id="nova-pagina-id" placeholder="page_id (como está no Make)" style="margin-bottom:0;" />
        <button id="btn-add-pagina" style="white-space:nowrap;">Adicionar</button>
      </div>
      <table>
        <thead><tr><th>Nome</th><th>Page ID</th><th>Ativa</th><th></th></tr></thead>
        <tbody id="paginas-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ====== CONFIGURAÇÃO — preencha com os dados do seu projeto Supabase ======
  const SUPABASE_URL = 'https://SEU-PROJETO.supabase.co';
  const SUPABASE_ANON_KEY = 'SUA_ANON_KEY_AQUI';
  // ============================================================================
  // Não precisa de webhook do Make aqui — o botão "Postar" chama /api/postar,
  // que fala direto com a Graph API do Facebook.

  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let paginasCache = [];
  let selecionadas = new Set();

  const linkInput = document.getElementById('link-input');
  const previewArea = document.getElementById('preview-area');
  const previewImg = document.getElementById('preview-img');
  const tituloInput = document.getElementById('titulo-input');
  const charCount = document.getElementById('char-count');
  const pagesGrid = document.getElementById('pages-grid');
  const postMsg = document.getElementById('post-msg');

  function truncar(titulo, limite = 60) {
    if (!titulo) return '';
    if (titulo.length <= limite) return titulo;
    return titulo.slice(0, limite).trim() + '...Ver mais';
  }

  function atualizarContador() {
    charCount.textContent = `${tituloInput.value.length} caracteres`;
  }
  tituloInput.addEventListener('input', atualizarContador);

  async function carregarPaginas() {
    const { data, error } = await supa.from('paginas_facebook').select('*').order('nome');
    if (error) { console.error(error); return; }
    paginasCache = data || [];
    renderPagesGrid();
    renderPaginasTabela();
  }

  function renderPagesGrid() {
    pagesGrid.innerHTML = '';
    paginasCache.filter(p => p.ativo).forEach(p => {
      const chip = document.createElement('label');
      chip.className = 'page-chip selected';
      chip.innerHTML = `<input type="checkbox" checked data-id="${p.id}" data-pageid="${p.page_id}" /> ${p.nome}`;
      selecionadas.add(p.page_id);
      chip.querySelector('input').addEventListener('change', (e) => {
        chip.classList.toggle('selected', e.target.checked);
        if (e.target.checked) selecionadas.add(p.page_id);
        else selecionadas.delete(p.page_id);
      });
      pagesGrid.appendChild(chip);
    });
  }

  document.getElementById('btn-selecionar-todas').addEventListener('click', () => {
    const checkboxes = pagesGrid.querySelectorAll('input[type="checkbox"]');
    const todasMarcadas = Array.from(checkboxes).every(cb => cb.checked);
    checkboxes.forEach(cb => {
      cb.checked = !todasMarcadas;
      cb.dispatchEvent(new Event('change'));
    });
  });

  document.getElementById('toggle-paginas').addEventListener('click', () => {
    const area = document.getElementById('paginas-grid-area');
    const aberto = area.style.display !== 'none';
    area.style.display = aberto ? 'none' : 'block';
    document.getElementById('toggle-paginas').textContent = aberto ? 'mostrar' : 'ocultar';
  });

  async function blobParaBase64(blob) {
    const buffer = await blob.arrayBuffer();
    let binario = '';
    const bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.byteLength; i++) binario += String.fromCharCode(bytes[i]);
    return btoa(binario);
  }

  let imagemCarimbadaBase64 = '';
  let tituloOriginalAtual = '';

  document.getElementById('btn-preview').addEventListener('click', async () => {
    const url = linkInput.value.trim();
    if (!url) return;
    postMsg.textContent = '';
    const btn = document.getElementById('btn-preview');
    btn.disabled = true; btn.textContent = 'Buscando...';
    try {
      const res = await fetch(`/api/preview?url=${encodeURIComponent(url)}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      tituloOriginalAtual = data.titulo_original || '';
      tituloInput.value = data.titulo_truncado || truncar(tituloOriginalAtual);
      atualizarContador();

      if (data.imagem_url) {
        btn.textContent = 'Aplicando selo...';
        const stampRes = await fetch(`/api/preview-stamp?url=${encodeURIComponent(data.imagem_url)}`);
        if (!stampRes.ok) throw new Error('Não consegui gerar a imagem com o selo.');
        const blob = await stampRes.blob();
        previewImg.src = URL.createObjectURL(blob);
        imagemCarimbadaBase64 = await blobParaBase64(blob);
      } else {
        previewImg.src = '';
        imagemCarimbadaBase64 = '';
      }
      previewArea.style.display = 'block';
    } catch (err) {
      postMsg.textContent = 'Erro ao buscar preview: ' + err.message;
      postMsg.className = 'msg error';
    } finally {
      btn.disabled = false; btn.textContent = 'Buscar preview';
    }
  });

  function tituloBaseSemSufixo(titulo) {
    return titulo.replace(/\.\.\.Ver mais$/, '').trim();
  }

  // Gera um corte ligeiramente diferente do título pra cada página, pra evitar
  // que 18-21 páginas publiquem o texto byte-a-byte idêntico ao mesmo tempo.
  function tituloVariado(tituloBase) {
    const limite = 55 + Math.floor(Math.random() * 11); // varia entre 55 e 65
    return truncar(tituloBase, limite);
  }

  function aguardar(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  document.getElementById('btn-postar').addEventListener('click', async () => {
    const link = linkInput.value.trim();
    const tituloDigitado = tituloInput.value.trim();
    const tituloBase = tituloOriginalAtual ? tituloBaseSemSufixo(tituloOriginalAtual) : tituloBaseSemSufixo(tituloDigitado);
    const paginas = Array.from(selecionadas);

    if (!link || !tituloDigitado || paginas.length === 0 || !imagemCarimbadaBase64) {
      postMsg.textContent = 'Preencha o link, busque o preview e selecione ao menos uma página.';
      postMsg.className = 'msg error';
      return;
    }

    const btn = document.getElementById('btn-postar');
    btn.disabled = true;
    postMsg.textContent = '';

    const progressoLista = document.getElementById('progresso-lista');
    progressoLista.innerHTML = '';
    const linhaPorPagina = {};
    paginas.forEach(pageId => {
      const nome = paginasCache.find(p => p.page_id === pageId)?.nome || pageId;
      const linha = document.createElement('div');
      linha.className = 'progresso-item';
      linha.innerHTML = `<span>${nome}</span><span class="status pendente">pendente</span>`;
      progressoLista.appendChild(linha);
      linhaPorPagina[pageId] = linha.querySelector('.status');
    });

    const resultados = [];
    for (let i = 0; i < paginas.length; i++) {
      const pageId = paginas[i];

      if (i > 0) {
        const esperaMs = 3000 + Math.floor(Math.random() * 6000); // 3 a 9 segundos
        linhaPorPagina[pageId].textContent = 'aguardando';
        btn.textContent = `Aguardando intervalo... (${i + 1}/${paginas.length})`;
        await aguardar(esperaMs);
      }

      const tituloDaPagina = tituloVariado(tituloBase) || tituloDigitado;
      btn.textContent = `Postando... (${i + 1}/${paginas.length})`;
      linhaPorPagina[pageId].textContent = 'postando';

      try {
        const apiRes = await fetch('/api/postar-pagina', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ page_id: pageId, titulo: tituloDaPagina, link, imagem_base64: imagemCarimbadaBase64 }),
        });
        const data = await apiRes.json();
        const status = data.status === 'sucesso' ? 'sucesso' : 'erro';
        linhaPorPagina[pageId].textContent = status;
        linhaPorPagina[pageId].className = `status ${status}`;
        resultados.push({ page_id: pageId, status, detalhe: data.detalhe });
      } catch (err) {
        linhaPorPagina[pageId].textContent = 'erro';
        linhaPorPagina[pageId].className = 'status erro';
        resultados.push({ page_id: pageId, status: 'erro', detalhe: String(err.message || err) });
      }
    }

    const erros = resultados.filter(r => r.status === 'erro');
    const statusGeral = erros.length === 0 ? 'sucesso' : (erros.length === resultados.length ? 'erro' : 'sucesso');

    await supa.from('materias_postadas').insert({
      link,
      titulo_truncado: tituloDigitado,
      paginas,
      status: statusGeral,
      detalhe_erro: erros.length ? JSON.stringify(erros) : null,
    });

    if (erros.length === 0) {
      postMsg.textContent = 'Postado com sucesso em todas as páginas!';
      postMsg.className = 'msg success';
      linkInput.value = '';
      tituloInput.value = '';
      tituloOriginalAtual = '';
      previewImg.src = '';
      imagemCarimbadaBase64 = '';
      previewArea.style.display = 'none';
    } else if (erros.length === resultados.length) {
      postMsg.textContent = 'Falhou em todas as páginas. Veja o status de cada uma acima.';
      postMsg.className = 'msg error';
    } else {
      postMsg.textContent = `Postado com sucesso, mas falhou em ${erros.length} página(s). Veja o status de cada uma acima.`;
      postMsg.className = 'msg error';
    }
    carregarHistorico();

    btn.disabled = false;
    btn.textContent = 'Postar nas páginas selecionadas';
  });

  async function carregarHistorico() {
    const { data, error } = await supa
      .from('materias_postadas')
      .select('*')
      .order('criado_em', { ascending: false })
      .limit(30);
    if (error) { console.error(error); return; }

    const tbody = document.getElementById('historico-body');
    tbody.innerHTML = '';
    (data || []).forEach(m => {
      const nomesPaginas = (m.paginas || [])
        .map(pid => paginasCache.find(p => p.page_id === pid)?.nome || pid)
        .join(', ');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${new Date(m.criado_em).toLocaleString('pt-BR')}</td>
        <td class="link-cell"><a href="${m.link}" target="_blank" style="color:inherit;">${m.link}</a></td>
        <td>${m.titulo_truncado || ''}</td>
        <td>${nomesPaginas}</td>
        <td><span class="status ${m.status}">${m.status}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // ====== Histórico recolhível ======
  document.getElementById('toggle-historico').addEventListener('click', () => {
    const area = document.getElementById('historico-area');
    const aberto = area.style.display !== 'none';
    area.style.display = aberto ? 'none' : 'block';
    document.getElementById('toggle-historico').textContent = aberto ? 'mostrar' : 'ocultar';
  });

  // ====== Gerenciar páginas ======
  document.getElementById('toggle-manage').addEventListener('click', () => {
    const area = document.getElementById('manage-area');
    area.style.display = area.style.display === 'none' ? 'block' : 'none';
  });

  function renderPaginasTabela() {
    const tbody = document.getElementById('paginas-body');
    tbody.innerHTML = '';
    paginasCache.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.nome}</td>
        <td style="font-family:'JetBrains Mono',monospace; font-size:12px;">${p.page_id}</td>
        <td>${p.ativo ? 'sim' : 'não'}</td>
        <td class="row-actions">
          <button class="secondary" data-action="toggle" data-id="${p.id}" data-ativo="${p.ativo}">${p.ativo ? 'Desativar' : 'Ativar'}</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('button[data-action="toggle"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const ativo = btn.dataset.ativo === 'true';
        await supa.from('paginas_facebook').update({ ativo: !ativo }).eq('id', id);
        carregarPaginas();
      });
    });
  }

  document.getElementById('btn-add-pagina').addEventListener('click', async () => {
    const nome = document.getElementById('nova-pagina-nome').value.trim();
    const pageId = document.getElementById('nova-pagina-id').value.trim();
    if (!nome || !pageId) return;
    await supa.from('paginas_facebook').insert({ nome, page_id: pageId });
    document.getElementById('nova-pagina-nome').value = '';
    document.getElementById('nova-pagina-id').value = '';
    carregarPaginas();
  });

  document.getElementById('btn-sair').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.reload();
  });

  // init
  carregarPaginas().then(carregarHistorico);
</script>
</body>
</html>
